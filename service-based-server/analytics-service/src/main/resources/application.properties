# 导入三个业务服务共用的 PostgreSQL、连接池和 JPA 设置。
spring.config.import=classpath:shared-defaults.properties
spring.application.name=analytics-service
server.port=${PORT:8083}
# 功能：后台分析和查询共用本进程的连接池。
spring.datasource.hikari.maximum-pool-size=${CHECKOUT_DB_POOL:8}

# 两个有界队列连接三段本地计算；数据库日志是跨服务通信和恢复的依据。
analytics.pipeline.poll-ms=${ANALYTICS_POLL_MS:25}
analytics.pipeline.queue-capacity=${ANALYTICS_QUEUE_CAPACITY:32}
analytics.pipeline.retry-ms=${ANALYTICS_RETRY_MS:250}
