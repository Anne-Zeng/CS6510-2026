spring.application.name=notification-service
server.port=${NOTIFICATION_PORT:8185}
server.address=127.0.0.1
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/pattern_notification_db}
spring.datasource.username=${NOTIFICATION_DB_USER:pattern_notification_user}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
notification.max-users=${NOTIFICATION_MAX_USERS:100}
notification.retry-ms=${NOTIFICATION_RETRY_MS:2000}
logging.level.org.apache.kafka=WARN
notification.stage-timing=${NOTIFICATION_STAGE_TIMING:false}
notification.ingest-batch-size=${NOTIFICATION_INGEST_BATCH_SIZE:16}
notification.dispatch-db-concurrency=${NOTIFICATION_DISPATCH_DB_CONCURRENCY:1}
notification.dispatch-batch-size=${NOTIFICATION_DISPATCH_BATCH_SIZE:512}
notification.dispatch-custom-plan=${NOTIFICATION_DISPATCH_CUSTOM_PLAN:true}
notification.coalesce-dispatch-writes=${NOTIFICATION_COALESCE_DISPATCH_WRITES:true}
notification.max-idle-poll-ms=${NOTIFICATION_MAX_IDLE_POLL_MS:1000}
notification.payload-cache-size=${NOTIFICATION_PAYLOAD_CACHE_SIZE:0}
notification.ack-drain-at-gate=${NOTIFICATION_ACK_DRAIN_AT_GATE:false}
