# 功能：三个服务连接同一个 PostgreSQL；服务进程不能各自创建/修改表。
spring.datasource.url=${CHECKOUT_DB_URL:jdbc:postgresql://localhost:5432/servicebaseddb}
spring.datasource.username=${CHECKOUT_DB_USER:postgres}
spring.datasource.password=${CHECKOUT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 功能：数据库成功提交后才返回成功；连接池按服务分别配置，不能简单乘以 stations。
# 最大连接数由每个服务自己的 application.properties 设置，避免 import 的优先级覆盖服务配置。
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET synchronous_commit TO on
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 功能：允许 100 个 station 并发请求，并保持连接复用，减少端口耗尽。
server.address=127.0.0.1
server.tomcat.threads.max=200
server.tomcat.accept-count=200
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s
server.error.include-stacktrace=never
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
checkout.low-stock-threshold=50
