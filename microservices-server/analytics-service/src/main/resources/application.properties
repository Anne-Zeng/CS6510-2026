# 功能：仅连接 Analytics 私有数据库。
spring.application.name=analytics-service
server.port=${ANALYTICS_PORT:8083}
spring.datasource.url=${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
spring.datasource.username=${ANALYTICS_DB_USER:analytics_user}
spring.datasource.password=${ANALYTICS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${ANALYTICS_DB_POOL:8}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
analytics.pipeline.poll-ms=${ANALYTICS_POLL_MS:25}
analytics.pipeline.queue-capacity=${ANALYTICS_QUEUE_CAPACITY:32}
analytics.pipeline.retry-ms=${ANALYTICS_RETRY_MS:250}

# 功能：Gateway 与服务间客户端复用长连接；Tomcat 默认每 100 个请求断开，会造成重连和 TIME_WAIT 堆积。
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s
