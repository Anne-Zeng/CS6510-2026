# 功能：只连接 Checkout 私有数据库，远程 Catalog 地址单独配置。
spring.application.name=checkout-service
server.port=${CHECKOUT_PORT:8082}
spring.datasource.url=${CHECKOUT_DB_URL:jdbc:postgresql://localhost:5432/checkout_db}
spring.datasource.username=${CHECKOUT_DB_USER:checkout_user}
spring.datasource.password=${CHECKOUT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${CHECKOUT_DB_POOL:16}
spring.datasource.hikari.connection-timeout=10000
catalog.base-url=${CATALOG_BASE_URL:http://localhost:8081}
server.error.include-stacktrace=never

# 功能：跨服务结账的库存地址与后台恢复间隔。
inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8084}
checkout.saga.recovery-ms=1000

# 功能：投递到独立 Analytics 服务，失败保留 outbox 并重试。
analytics.base-url=${ANALYTICS_BASE_URL:http://localhost:8083}
checkout.outbox.poll-ms=${CHECKOUT_OUTBOX_POLL_MS:250}

# 功能：在 Checkout 端仅限制实际库存 HTTP 调用的数量，避免连接池排队与重复请求放大。
checkout.inventory.max-in-flight=${CHECKOUT_INVENTORY_MAX_IN_FLIGHT:8}

# 功能：Gateway 与服务间客户端复用长连接；Tomcat 默认每 100 个请求断开，会造成重连和 TIME_WAIT 堆积。
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s
