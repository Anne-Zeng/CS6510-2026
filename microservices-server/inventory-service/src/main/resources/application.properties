# 功能：库存服务使用私有连接参数，不加载共享数据库配置。
spring.application.name=inventory-service
server.port=${INVENTORY_PORT:8084}
spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${INVENTORY_DB_USER:inventory_user}
spring.datasource.password=${INVENTORY_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${INVENTORY_DB_POOL:8}
spring.datasource.hikari.connection-timeout=10000
server.error.include-stacktrace=never
inventory.low-stock-threshold=50

# 功能：写请求在数据库连接池之前有界排队，避免每个 HTTP 请求占着连接等待行锁。
inventory.max-in-flight=${INVENTORY_MAX_IN_FLIGHT:8}

# 功能：Gateway 与服务间客户端复用长连接；Tomcat 默认每 100 个请求断开，会造成重连和 TIME_WAIT 堆积。
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s
