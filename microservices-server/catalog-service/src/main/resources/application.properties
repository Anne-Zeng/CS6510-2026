# 功能：仅连接 Catalog 私有数据库，不导入共享配置。
spring.application.name=catalog-service
server.port=${CATALOG_PORT:8081}
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
spring.datasource.username=${CATALOG_DB_USER:catalog_user}
spring.datasource.password=${CATALOG_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${CATALOG_DB_POOL:8}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-stacktrace=never

# 功能：Gateway 与服务间客户端复用长连接；Tomcat 默认每 100 个请求断开，会造成重连和 TIME_WAIT 堆积。
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s
