spring.application.name=pipeline-server
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Database access layer: PostgreSQL, the same engine the monolith used, so the
# week-over-week comparison measures architecture rather than storage engine.
# ---------------------------------------------------------------------------
spring.datasource.url=${CHECKOUT_DB_URL:jdbc:postgresql://localhost:5432/pipelinedb}
spring.datasource.username=${CHECKOUT_DB_USER:postgres}
spring.datasource.password=${CHECKOUT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sized at roughly 2x the 8 cores this machine has, not at the client's station
# count. Measured at 40 stations: a pool of 16 and a pool of 50 deliver the same
# throughput (~77 tx/s), but 16 gives a 3x better tail - P99 on complete was
# 751ms versus 2485ms, and max 1.3s versus 4.3s. Past saturation, extra
# connections do not add capacity; they just move queueing from the pool into
# the database, where 50 backends thrash 8 cores.
spring.datasource.hikari.maximum-pool-size=${CHECKOUT_DB_POOL:16}
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.connection-timeout=10000

# Successful responses require a durable commit.
spring.datasource.hikari.connection-init-sql=SET synchronous_commit TO on

# The dialect is detected from the JDBC connection; setting it explicitly only
# produces a deprecation warning on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Batch the seeder's 2,000 catalog + 2,000 inventory inserts and the analytics
# window's top-10 result rows into multi-row statements.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Polling affects publication latency only; exact windows are replayed from PostgreSQL.
analytics.pipeline.poll-ms=25
analytics.pipeline.queue-capacity=32
analytics.pipeline.retry-ms=250

# ---------------------------------------------------------------------------
# API layer
# ---------------------------------------------------------------------------
# One request is held per station, so the request-handling pool must comfortably
# exceed the 100 stations used by the stress run.
server.tomcat.threads.max=200
server.tomcat.accept-count=200

# Tomcat closes a keep-alive connection after 100 requests by default. The load
# client is a small set of long-lived stations issuing hundreds of requests per
# second each, so that default made it reconnect constantly, and every closed
# socket sits in TIME_WAIT for 2*MSL (30s on macOS). The churn eventually
# starved the client of ephemeral ports: it began failing with "Can't assign
# requested address" and, because a failed station retries immediately with no
# backoff, the failures fed themselves. -1 keeps connections for the whole run.
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s

debug=false
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
server.error.include-stacktrace=never
checkout.low-stock-threshold=50
