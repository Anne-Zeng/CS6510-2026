# Checkout owns its database; all remote business communication uses Kafka.
spring.application.name=checkout-service
server.port=${CHECKOUT_PORT:8082}
spring.datasource.url=${CHECKOUT_DB_URL:jdbc:postgresql://localhost:5432/event_checkout_db}
spring.datasource.username=${CHECKOUT_DB_USER:event_checkout_user}
spring.datasource.password=${CHECKOUT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${CHECKOUT_DB_POOL:16}
spring.datasource.hikari.connection-timeout=10000
server.error.include-stacktrace=never

# Durable saga recovery after unknown Kafka outcomes.
checkout.saga.recovery-ms=${CHECKOUT_SAGA_RECOVERY_MS:1000}

# Publish scan events to Kafka; failure retains the outbox for retry.
checkout.outbox.poll-ms=${CHECKOUT_OUTBOX_POLL_MS:250}

# Limit concurrent Inventory commands while allowing scans to proceed.
checkout.inventory.max-in-flight=${CHECKOUT_INVENTORY_MAX_IN_FLIGHT:64}

# 功能：Gateway 与服务间客户端复用长连接；Tomcat 默认每 100 个请求断开，会造成重连和 TIME_WAIT 堆积。
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=120s

# Kafka connection/group lifecycle is verbose at INFO; keep failures visible.
logging.level.org.apache.kafka=WARN
